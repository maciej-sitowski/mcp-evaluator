    <section class="split">
      <div class="card listcard">
        <div class="filters">
          <div class="seg" id="case-status"></div>
          <input id="case-q" type="search" placeholder="Search cases…">
        </div>
        <div id="caselist"></div>
      </div>
      <div class="card" id="casepanel"></div>
    </section>
  </div>
</main>
</div>

<script>
const COLORS = ['#6ea8fe', '#5fd39a', '#f3c066', '#f2677f', '#c4a7e7', '#7fd6e0', '#ef9f76', '#a3c76d', '#e58fb7', '#9aa4b2'];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (x) => (x * 100).toFixed(0) + '%';
const fmtTime = (iso) => new Date(iso).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
const shortTime = (iso) => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
// A case belongs to a product (older runs called it "set").
const prodOf = (c) => c.product || c.set;
const caseKey = (c) => prodOf(c) + '/' + c.id;

// Products seen in any run, in first-seen order. Colour: product.json "color", else a stable palette slot.
let PRODUCTS = {};
function buildProducts() {
  const reg = {};
  allRuns.forEach((r) => Object.entries(r.summary.products || {}).forEach(([id, p]) => {
    reg[id] = { id, name: p.name || (reg[id] && reg[id].name) || id, color: p.color || (reg[id] && reg[id].color) };
  }));
  Object.keys(reg).forEach((id, i) => { reg[id].color = reg[id].color || COLORS[i % COLORS.length]; });
  PRODUCTS = reg;
}
const productIds = (runs) => Object.keys(PRODUCTS).filter((id) => runs.some((r) => r.summary.products && r.summary.products[id]));
const pinfo = (id) => PRODUCTS[id] || { id, name: id, color: '#8b95a7' };
const pdot = (id) => `<span class="pdot" style="background:${esc(pinfo(id).color)}"></span>`;

// Does a returned chunk id satisfy a golden's doc reference? (same rules as evals/metrics/base.py `matches`)
const matchesRef = (rid, pat) => (pat.endsWith('*') ? rid.startsWith(pat.slice(0, -1)) : rid === pat || rid.startsWith(pat + '#'));

// Metrics are shown in these groups (charts, verdict tables). Unknown names fall into "Other".
const GROUPS = [
  { name: 'Retrieval', section: 'Search tool (direct call)', match: (n) => ['Recall@K', 'MRR', 'ForbiddenAbsent', 'ProductIsolation'].includes(n) },
  { name: 'Contract & speed', section: 'Search tool (direct call)', match: (n) => ['FilterCompliance', 'ResponseContract', 'Latency'].includes(n) },
  { name: 'Correctness', section: 'Correctness (LLM agent)', match: (n) => ['AgentToolUse', 'AgentRecall', 'AnswerFacts', 'Judge:Arguments', 'Judge:Correctness', 'Judge:Answer'].includes(n) },
  { name: 'Relevancy', section: 'Relevancy (LLM agent)', match: (n) => ['Judge:Relevance', 'Judge:AnswerRelevancy'].includes(n) },
  { name: 'Quality', section: 'Quality (LLM agent)', match: (n) => n === 'Judge:Quality' },
];
// Plain-language explanations, shown in the run details.
const METRIC_HELP = {
  'Recall@K': 'Share of the expected docs that the search returned.',
  'MRR': 'How high the first expected doc ranks (1st = 1.0, 2nd = 0.5, 3rd = 0.33, absent = 0).',
  'ForbiddenAbsent': 'Docs that must NOT show up are absent.',
  'ProductIsolation': 'Every result comes from the product that was searched (no leaks from other products).',
  'FilterCompliance': 'Every result respects the category / max price that was asked for (older runs).',
  'ResponseContract': 'Response has the required fields, respects the limit and is sorted by score.',
  'Latency': 'Tool call finished within the time budget.',
  'AgentToolUse': 'The agent actually called the search tool and got a usable result.',
  'AgentRecall': "Share of the expected docs that the agent's own search returned.",
  'AnswerFacts': 'The answer contains every fact the golden lists under must_include.',
  'Judge:Arguments': 'LLM judge: did the agent turn the question into correct search arguments (right product, good keywords)?',
  'Judge:Correctness': 'LLM judge: is the answer right compared to the reference answer and the retrieved docs?',
  'Judge:Answer': 'LLM judge (older runs): is the answer grounded in the tool results?',
  'Judge:Relevance': 'LLM judge: are the returned doc sections relevant to the question?',
  'Judge:AnswerRelevancy': 'LLM judge: does the answer address what the customer asked?',
  'Judge:Quality': 'LLM judge: is the answer clear, concise, helpful and well-toned?',
};
// the three LLM-agent groups get a KPI card and a history column
const LLM_GROUPS = ['Correctness', 'Relevancy', 'Quality'];
// Short human names for the run details (the technical name stays available as a tooltip).
const METRIC_LABEL = {
  'Recall@K': 'Expected docs found', 'MRR': 'Rank of first hit', 'ForbiddenAbsent': 'No forbidden docs',
  'ProductIsolation': 'Stays within the product', 'FilterCompliance': 'Filters respected', 'ResponseContract': 'Response format',
  'Latency': 'Speed', 'AgentToolUse': 'Used the search tool', 'AgentRecall': 'Agent found expected docs',
  'AnswerFacts': 'Required facts in answer',
  'Judge:Arguments': 'Search arguments', 'Judge:Correctness': 'Answer correctness', 'Judge:Answer': 'Answer grounding (old)',
  'Judge:Relevance': 'Results relevance', 'Judge:AnswerRelevancy': 'Answer relevancy', 'Judge:Quality': 'Answer quality',
};
const labelOf = (n) => METRIC_LABEL[n] || n;
// Run details show four areas: the three LLM-agent groups first, the plain search-tool checks last.
const SECTION_ORDER = ['Correctness', 'Relevancy', 'Quality', 'Search tool', 'Other'];
const SECTION_DESC = {
  'Correctness': 'Did the agent do and say the right things?',
  'Relevancy': 'Is it about what the customer asked?',
  'Quality': 'Is it a good answer?',
  'Search tool': 'The search tool called directly with fixed arguments (no LLM).',
  'Other': '',
};
const groupOf = (n) => GROUPS.find((g) => g.match(n)) || { name: 'Other', section: 'Other' };

let allRuns = [];                 // run summaries, oldest first
const fullRunCache = {};
// UI state; mirrored into the URL hash so views are linkable.
const state = { tab: 'overview', runId: null, caseKey: null, status: 'all', section: null, product: null, q: '', view: 'checks', productSort: 'attention', productQ: '', productsAll: false };
let current = { run: null, prev: null };

// ---------------------------------------------------------------- data
async function api(path) {
  const res = await fetch(path, { cache: 'no-store' });
  if (!res.ok) throw new Error(path + ' -> ' + res.status);
  return res.json();
}
async function fullRun(id) {
  if (!fullRunCache[id]) fullRunCache[id] = await api('/api/runs/' + encodeURIComponent(id));
  return fullRunCache[id];
}
const runNumber = (run) => allRuns.indexOf(run) + 1;
const runById = (id) => allRuns.find((r) => r.id === id);
const visibleRuns = () => { const n = +$('range').value; return n ? allRuns.slice(-n) : allRuns; };
const judgeEnabled = (r) => !!(r.llm_judge && r.llm_judge.enabled);
// History-table filters. They narrow the rows only; the charts above still use the Show range.
// params[key] === '' means the run must contain that parameter (any value). A string means that value.
const histFilter = { judge: 'all', params: {}, open: false, paramQuery: '' };

// ---- LLM cost. `cost` objects come from summary.cost / summary.products[id].cost (run level, per product)
// or from a case's cost.total / cost.agent / cost.judge. null = the run had no LLM judge (or predates cost tracking).
const usd = (v) => (v === null || v === undefined ? 'n/a' : v >= 1 ? '$' + v.toFixed(2) : v >= 0.1 ? '$' + v.toFixed(3) : '$' + v.toFixed(4));
const ktok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0));
// "$0.0230", "$0.0230+" when some calls could not be priced (lower bound), "n/a" when nothing could, "–" when there is no cost data
function costText(c, key = 'total_usd') {
  if (!c) return '–';
  const v = c[key];
  return usd(v) + (v !== null && v !== undefined && c.complete === false ? '+' : '');
}
function costTitle(c) {
  if (!c) return 'No LLM cost: the LLM judge was off, or this run predates cost tracking';
  const lines = [];
  if (c.agent_usd !== undefined) lines.push(`agent ${usd(c.agent_usd)} · judge ${usd(c.judge_usd)}`);
  if (c.avg_case_usd !== undefined && c.avg_case_usd !== null) lines.push(`${usd(c.avg_case_usd)} per case`);
  lines.push(`${(c.total_tokens || 0).toLocaleString()} tokens in ${c.calls} model calls`);
  if (c.complete === false) lines.push('some calls could not be priced (model missing from PRICING in run_evals.py): this is a lower bound');
  return lines.join('\n');
}
// mean of the average scores of all metrics in a group (null when the run has none)
const sectionOf = (n) => { const g = groupOf(n).name; return LLM_GROUPS.includes(g) || g === 'Other' ? g : 'Search tool'; };
const sectionNames = (names) => SECTION_ORDER.filter((x) => names.some((n) => sectionOf(n) === x));
const failedIn = (c, section) => Object.entries(c.metrics).filter(([n, m]) => sectionOf(n) === section && !m.success);
const groupAvg = (sum, group) => {
  const vals = Object.keys(sum.metrics).filter((n) => groupOf(n).name === group).map((n) => sum.metrics[n].avg_score);
  return vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
};

// ---------------------------------------------------------------- routing (URL hash)
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  state.tab = p.has('run') || p.get('tab') === 'run' ? 'run' : 'overview';
  state.runId = p.get('run') || state.runId;
  state.caseKey = p.get('case');
  state.status = p.get('status') || 'all';
  state.section = p.get('section');
  state.product = p.get('product');
  state.view = p.get('view') || 'checks';
  state.q = p.get('q') || '';
}
function writeHash(push) {
  const p = new URLSearchParams();
  if (state.tab === 'run') {
    if (state.runId) p.set('run', state.runId); else p.set('tab', 'run');
    if (state.caseKey) p.set('case', state.caseKey);
    if (state.status !== 'all') p.set('status', state.status);
    if (state.section) p.set('section', state.section);
    if (state.product) p.set('product', state.product);
    if (state.view !== 'checks') p.set('view', state.view);
    if (state.q) p.set('q', state.q);
  }
  const url = location.pathname + (p.toString() ? '#' + p.toString() : '');
  history[push ? 'pushState' : 'replaceState'](null, '', url);
}
// Change state, update URL, redraw. `push` creates a browser-history entry (tab / run switches).
async function go(patch, push = false) {
  Object.assign(state, patch);
  writeHash(push);
  await renderAll();
}

// ---------------------------------------------------------------- overview: KPIs
// Each run stands alone. A later run may cover different products, cases, or the judge, so a delta against the previous file would not mean the search got better or worse.
function renderKpis() {
  const cur = allRuns[allRuns.length - 1];
  const s = cur.summary;
  const cards = [
    ['Pass rate', pct(s.pass_rate), `${s.cases_passed} of ${s.cases_total} cases`],
  ];
  LLM_GROUPS.forEach((g) => {
    const v = groupAvg(s, g);
    if (v !== null) cards.push([g + ' (avg)', v.toFixed(2), '']);
  });
  cards.push(['Latency p95', s.latency_ms.p95.toFixed(1) + ' ms', '']);
  $('latest-info').textContent = `· #${allRuns.length} · ${fmtTime(cur.timestamp)}`;
  $('latest-open').onclick = () => go({ tab: 'run', runId: cur.id, caseKey: null, status: 'all', section: null, product: null, q: '' }, true);
  $('kpis').innerHTML = cards.map(([label, value, note]) =>
    `<div class="card kpi"><div class="label">${esc(label)}${note ? ` · ${esc(note)}` : ''}</div><div class="value">${esc(value)}</div></div>`).join('');
}

// ---------------------------------------------------------------- overview: by product
// Average score of every metric in an area (Correctness, Relevancy, Quality, Search tool).
function sectionAvg(sum, section) {
  if (!sum || !sum.metrics) return null;
  const vals = Object.keys(sum.metrics).filter((n) => sectionOf(n) === section && typeof sum.metrics[n].avg_score === 'number').map((n) => sum.metrics[n].avg_score);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}

// One metric's score across the runs in the current range. `threshold` draws the target line (0..1).
function progressChart(points, color, threshold) {
  const W = 360, H = 160, L = 30, R = 10, T = 12, B = 22;
  const iw = W - L - R, ih = H - T - B;
  if (!points.length) return '';
  const yOf = (v) => T + (1 - Math.max(0, Math.min(1, v))) * ih;
  const xOf = (i) => L + (points.length < 2 ? iw / 2 : (i / (points.length - 1)) * iw);
  points.forEach((p, i) => { p.x = xOf(i); p.y = yOf(p.v); });
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join('');
  const grid = [0, 0.5, 1].map((g) => {
    const yy = yOf(g);
    return `<line x1="${L}" y1="${yy.toFixed(1)}" x2="${W - R}" y2="${yy.toFixed(1)}" stroke="currentColor" stroke-opacity="0.18"/>` +
      `<text x="${L - 6}" y="${yy.toFixed(1)}" dominant-baseline="middle" text-anchor="end">${Math.round(g * 100)}</text>`;
  }).join('');
  const thr = typeof threshold === 'number'
    ? `<line x1="${L}" y1="${yOf(threshold).toFixed(1)}" x2="${W - R}" y2="${yOf(threshold).toFixed(1)}" stroke="currentColor" stroke-opacity="0.45" stroke-dasharray="4 3"><title>target ${Math.round(threshold * 100)}%</title></line>`
    : '';
  const step = Math.max(1, Math.ceil(points.length / 8));
  const xlab = points.map((p, i) => (i % step && i !== points.length - 1) ? '' :
    `<text x="${p.x.toFixed(1)}" y="${H - 4}" text-anchor="middle">#${p.n}</text>`).join('');
  const dots = points.map((p) =>
    `<circle class="pt" data-run="${esc(p.runId)}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${esc(color)}"><title>#${p.n} · ${pct(p.v)} · click to open</title></circle>`).join('');
  return `<svg class="progress" viewBox="0 0 ${W} ${H}" role="img">${grid}${thr}` +
    `<path d="${d}" fill="none" stroke="${esc(color)}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}${xlab}</svg>`;
}

const PRODUCT_LIMIT = 8;   // sections shown before "Show all"

// which products are folded shut in the overview accordion (remembered across reloads)
const collapsedOverviewProducts = new Set((() => { try { return JSON.parse(localStorage.getItem('collapsedOverviewProducts') || '[]'); } catch { return []; } })());
const saveCollapsedOverview = () => { try { localStorage.setItem('collapsedOverviewProducts', JSON.stringify([...collapsedOverviewProducts])); } catch { /* storage unavailable */ } };

// the threshold a group is scored against, read from its LLM-judge metric in a full run (these groups also
// include deterministic metrics with their own, unrelated thresholds, e.g. 1.0 — only the judge one is the "target")
function groupThreshold(fullRunWithCases, group) {
  if (fullRunWithCases) {
    for (const c of fullRunWithCases.cases) {
      for (const [name, m] of Object.entries(c.metrics)) {
        if (name.startsWith('Judge:') && groupOf(name).name === group && typeof m.threshold === 'number') return m.threshold;
      }
    }
  }
  return 0.7;
}

async function renderProducts() {
  const cur = allRuns[allRuns.length - 1];
  const all = Object.keys(cur.summary.products || {});
  $('products-head').hidden = $('products-card').hidden = !all.length;
  if (!all.length) return;
  const runs = visibleRuns();

  // sort: products that need attention first (lowest pass rate), or by name
  const rate = (id) => cur.summary.products[id].pass_rate;
  const sorts = [['attention', 'Needs attention first'], ['name', 'Name']];
  $('product-sort').innerHTML = all.length < 2 ? '' : sorts.map(([v, l]) =>
    `<button data-sort="${v}" class="${state.productSort === v ? 'active' : ''}">${l}</button>`).join('');
  document.querySelectorAll('#product-sort button').forEach((b) =>
    b.addEventListener('click', () => { state.productSort = b.dataset.sort; renderProducts(); }));
  $('product-q').hidden = all.length <= PRODUCT_LIMIT;
  $('product-q').value = state.productQ;

  const q = state.productQ.trim().toLowerCase();
  let ids = all.filter((id) => !q || (id + ' ' + pinfo(id).name).toLowerCase().includes(q));
  ids.sort((a, b) => state.productSort === 'name' ? pinfo(a).name.localeCompare(pinfo(b).name) : rate(a) - rate(b) || pinfo(a).name.localeCompare(pinfo(b).name));
  const hidden = !q && !state.productsAll && ids.length > PRODUCT_LIMIT ? ids.length - PRODUCT_LIMIT : 0;
  if (hidden) ids = ids.slice(0, PRODUCT_LIMIT);

  const curFull = await fullRun(cur.id).catch(() => null);
  const thresholds = Object.fromEntries(LLM_GROUPS.map((g) => [g, groupThreshold(curFull, g)]));

  if (!ids.length) {
    $('products').innerHTML = `<div class="no-products">No product matches “${esc(state.productQ)}”.</div>`;
    return;
  }

  $('products').innerHTML = ids.map((id) => {
    const p = cur.summary.products[id];
    const ok = p.pass_rate >= 0.999;
    const folded = collapsedOverviewProducts.has(id);
    const sections = SECTION_ORDER.filter((sec) => sec !== 'Other' && runs.some((r) => sectionAvg(r.summary.products && r.summary.products[id], sec) !== null));
    const charts = sections.map((sec) => {
      const points = [];
      runs.forEach((r) => {
        const v = sectionAvg(r.summary.products && r.summary.products[id], sec);
        if (v === null) return;
        points.push({ v, n: runNumber(r), runId: r.id });
      });
      const latest = points[points.length - 1];
      const thr = LLM_GROUPS.includes(sec) ? thresholds[sec] : 1;
      const tone = !latest ? '' : latest.v >= thr ? 'ok' : latest.v >= thr - 0.15 ? 'warn' : 'bad';
      const color = tone === 'bad' ? 'var(--bad)' : tone === 'warn' ? 'var(--warn)' : 'var(--good)';
      return `<div class="progress-card"><div class="chart-head"><span class="lbl" title="${esc(SECTION_DESC[sec] || '')}">${esc(sec)}</span><b class="${tone}">${latest ? pct(latest.v) : '–'}</b></div>${progressChart(points, color, LLM_GROUPS.includes(sec) ? thr : null)}</div>`;
    }).join('');
    return `<div class="pacc ${folded ? 'collapsed' : ''}" data-id="${esc(id)}">
      <div class="pacc-head" style="--pc:${esc(pinfo(id).color)}">
        <div class="pacc-toggle" role="button" tabindex="0" aria-expanded="${!folded}">
          <span class="chev">▾</span>
          <span class="pacc-name">${esc(pinfo(id).name)}</span>
          <div class="pacc-rate"><span class="bar ${ok ? 'ok' : 'bad'}"><i style="width:${Math.round(p.pass_rate * 100)}%"></i></span>
            <b>${pct(p.pass_rate)}</b><span class="muted">${p.cases_passed}/${p.cases_total}</span></div>
          <span class="pacc-spacer"></span>
        </div>
        <button class="open-product" data-open="${esc(id)}">Open cases →</button>
      </div>
      <div class="pacc-body">
        ${charts ? `<div class="metric-charts">${charts}</div>` : ''}
      </div>
    </div>`;
  }).join('') + (hidden ? `<div class="more-products" id="show-all-products">Show all ${all.length} products (${hidden} more)</div>` : '');

  document.querySelectorAll('.pacc-toggle').forEach((el) => {
    const toggle = () => {
      const id = el.closest('.pacc').dataset.id;
      if (collapsedOverviewProducts.has(id)) collapsedOverviewProducts.delete(id); else collapsedOverviewProducts.add(id);
      saveCollapsedOverview();
      renderProducts();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
  document.querySelectorAll('.open-product').forEach((b) => b.addEventListener('click', (e) => {
    e.stopPropagation();
    go({ tab: 'run', runId: cur.id, caseKey: null, status: 'all', section: null, product: b.dataset.open, q: '' }, true);
  }));
  document.querySelectorAll('.progress .pt').forEach((c) => c.addEventListener('click', () =>
    go({ tab: 'run', runId: c.dataset.run, caseKey: null, status: 'all', section: null, product: null, q: '' }, true)));
  const more = $('show-all-products');
  if (more) more.addEventListener('click', () => { state.productsAll = true; renderProducts(); });
}

// ---------------------------------------------------------------- overview: history table
function runParams(r) {
  const p = r && r.params && typeof r.params === 'object' && !Array.isArray(r.params) ? r.params : {};
  return Object.entries(p).filter(([k, v]) => String(k).trim() && v != null && String(v).trim() !== '');
}
function paramsHtml(r) {
  const bits = [];
  if (r.label) bits.push(`<span class="chip">${esc(r.label)}</span>`);
  for (const [k, v] of runParams(r)) bits.push(`<span class="chip"><span class="k">${esc(k)}</span>${esc(v)}</span>`);
  return bits.join('');
}

function matchesHist(r) {
  if (histFilter.judge === 'on' && !judgeEnabled(r)) return false;
  if (histFilter.judge === 'off' && judgeEnabled(r)) return false;
  const have = Object.fromEntries(runParams(r).map(([k, v]) => [k, String(v)]));
  return Object.entries(histFilter.params).every(([k, v]) => k in have && (!v || have[k] === v));
}

function paramIndex(pool) {
  const values = {};
  const keys = [];
  pool.forEach((r) => runParams(r).forEach(([k, v]) => {
    const text = String(v);
    if (!values[k]) { values[k] = []; keys.push(k); }
    if (!values[k].includes(text)) values[k].push(text);
  }));
  return { keys, values };
}

function closeHistFilter() {
  histFilter.open = false;
  histFilter.paramQuery = '';
}

function hasParam(k) { return Object.prototype.hasOwnProperty.call(histFilter.params, k); }

function renderHistFilters(pool) {
  const { keys, values } = paramIndex(pool);
  Object.keys(histFilter.params).forEach((k) => {
    if (!values[k]) delete histFilter.params[k];
    else if (histFilter.params[k] && !values[k].includes(histFilter.params[k])) histFilter.params[k] = '';
  });
  const qEl = $('hist-filter-q');
  const refocus = !!(qEl && document.activeElement === qEl);
  const caret = refocus ? qEl.selectionStart : null;
  const judgeOpts = ['all', 'on', 'off'].map((v) => `<option value="${v}" ${histFilter.judge === v ? 'selected' : ''}>${v === 'all' ? 'any' : v}</option>`).join('');
  const sels = Object.keys(histFilter.params).map((k) => {
    const cur = histFilter.params[k] || '';
    const opts = [`<option value="">any value</option>`].concat((values[k] || []).map((v) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v)}</option>`));
    return `<span class="fsel"><span>${esc(k)}</span><select data-param-select="${esc(k)}">${opts.join('')}</select><button type="button" class="xbtn" data-clear-param="${esc(k)}" aria-label="Remove ${esc(k)}">×</button></span>`;
  }).join('');
  const query = histFilter.paramQuery.trim().toLowerCase();
  const unused = keys.filter((k) => !hasParam(k) && (!query || k.toLowerCase().includes(query)));
  const menu = histFilter.open ? `<div class="filter-pop"><input id="hist-filter-q" type="search" placeholder="Find a parameter…" value="${esc(histFilter.paramQuery)}"><div class="flist">${unused.map((k) => `<button type="button" class="frow-h" data-add-key="${esc(k)}">${esc(k)}</button>`).join('') || '<div class="fempty muted">No parameters left.</div>'}</div></div>` : '';
  const add = keys.some((k) => !hasParam(k)) ? `<span class="pop-anchor"><button type="button" data-filter-toggle aria-expanded="${histFilter.open}">+ Parameter</button>${menu}</span>` : '';
  $('hist-filters').innerHTML = `<label class="fsel"><span>LLM judge</span><select data-judge-select>${judgeOpts}</select></label>${sels}${add}`;
  if (refocus && $('hist-filter-q')) {
    const next = $('hist-filter-q');
    next.focus();
    if (caret !== null) next.setSelectionRange(caret, caret);
  }
}

function renderHistory() {
  const pool = visibleRuns().slice().reverse();
  renderHistFilters(pool);
  const runs = pool.filter(matchesHist);
  const ids = productIds(pool);
  const showParams = pool.some((r) => r.label || runParams(r).length);
  $('history-head').innerHTML = '<th>#</th><th>Time</th>' +
    (showParams ? '<th title="Set in RUN_PARAMS in run_evals.py, or with --param key=value / --label">Parameters</th>' : '') +
    '<th>LLM judge</th><th>Pass rate</th>' +
    (ids.length ? '<th title="one block per product: green = all cases pass, red = some fail">Products</th>' : '') +
    '<th>Correctness</th><th>Relevancy</th><th>Quality</th><th>p95 latency</th><th title="agent + judge, at API list prices">LLM cost</th><th></th>';
  if (!runs.length) {
    $('history').innerHTML = `<tr><td class="hist-empty" colspan="${$('history-head').children.length}">No runs match these filters.</td></tr>`;
    return;
  }
  $('history').innerHTML = runs.map((r) => {
    const idx = allRuns.indexOf(r);
    const s = r.summary;
    const g = (name) => { const v = groupAvg(s, name); return v === null ? '–' : v.toFixed(2); };
    const judge = judgeEnabled(r) ? '<span class="pill pass" title="agent + LLM judge metrics included">on</span>' : '<span class="pill info" title="deterministic metrics only">off</span>';
    const strip = ids.map((id) => {
      const pr = s.products && s.products[id];
      const tip = `${pinfo(id).name}: ${pr ? `${pr.cases_passed}/${pr.cases_total} passed` : 'not in this run'}`;
      return `<i class="${pr ? (pr.pass_rate >= 0.999 ? 'ok' : 'bad') : ''}" title="${esc(tip)}"></i>`;
    }).join('');
    const meta = paramsHtml(r);
    const paramsCell = showParams ? `<td>${meta ? `<span class="params">${meta}</span>` : '<span class="muted">–</span>'}</td>` : '';
    const prodCells = ids.length ? `<td><span class="strip">${strip}</span></td>` : '';
    return `<tr class="run-row" data-id="${esc(r.id)}">
      <td>${idx + 1}</td><td>${esc(fmtTime(r.timestamp))}</td>${paramsCell}<td>${judge}</td>
      <td title="${s.cases_passed} of ${s.cases_total} cases passed"><b>${pct(s.pass_rate)}</b></td>${prodCells}
      <td>${g('Correctness')}</td><td>${g('Relevancy')}</td><td>${g('Quality')}</td>
      <td>${s.latency_ms.p95.toFixed(1)} ms</td>
      <td title="${esc(costTitle(s.cost))}">${esc(costText(s.cost))}</td>
      <td class="rowact"><button class="rowdel" data-del="${esc(r.id)}" title="Delete this run" aria-label="Delete run #${idx + 1}">🗑</button></td></tr>`;
  }).join('');
  document.querySelectorAll('button.rowdel').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); askDeleteRun(b.dataset.del); }));
  document.querySelectorAll('tr.run-row').forEach((tr) => tr.addEventListener('click', () =>
    go({ tab: 'run', runId: tr.dataset.id, caseKey: null, status: 'all', section: null, product: null, q: '' }, true)));
}

// ---------------------------------------------------------------- run tab: toolbar, banners, scorecard
function renderRunBar(run) {
  const idx = allRuns.findIndex((r) => r.id === run.id);
  $('run-select').innerHTML = allRuns.slice().reverse().map((r) => {
    const i = allRuns.indexOf(r);
    const label = `#${i + 1} · ${shortTime(r.timestamp)} · ${pct(r.summary.pass_rate)} passed`;
    return `<option value="${esc(r.id)}" ${r.id === run.id ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
  $('run-prev').disabled = idx <= 0;
  $('run-next').disabled = idx >= allRuns.length - 1;
  const meta = paramsHtml(run);
  $('run-params').innerHTML = meta;
  $('run-params').hidden = !meta;
}

function renderBanners(run) {
  const out = [];
  if (!judgeEnabled(run)) {
    const why = run.llm_judge && run.llm_judge.status ? run.llm_judge.status : 'this run predates the LLM judge';
    out.push(`<div class="banner info"><b>No LLM-judge metrics in this run.</b> ${esc(why)}</div>`);
  } else {
    const broken = run.cases.filter((c) => c.agent && c.agent.error);
    if (broken.length) {
      out.push(`<div class="banner warn"><b>${broken.length} case${broken.length > 1 ? 's' : ''} had agent errors</b> ` +
        `(e.g. <code>${esc(broken[0].agent.error)}</code>). Their agent/judge scores are 0 because the model never produced an answer, ` +
        `not because search quality dropped.</div>`);
    }
  }
  $('banners').innerHTML = out.join('');
}

const cellOn = (sec, id) => state.section === sec && (state.product || null) === (id || null);
const nameOn = (id) => !!id && state.product === id && !state.section;

function scoreModel(run) {
  const ids = [...new Set(run.cases.map(prodOf))];
  const sections = sectionNames([...new Set(run.cases.flatMap((c) => Object.keys(c.metrics)))]);
  const stat = (cases, sec) => {
    const scores = cases.flatMap((c) => Object.entries(c.metrics).filter(([n]) => sectionOf(n) === sec).map(([, m]) => m.score));
    if (!scores.length) return null;
    const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
    return { avg, failing: cases.filter((c) => failedIn(c, sec).length).length, total: cases.length };
  };
  const rowFor = (id, cases) => ({
    id, name: id ? pinfo(id).name : 'All products', n: cases.length,
    cells: Object.fromEntries(sections.map((sec) => [sec, stat(cases, sec)])),
  });
  const rows = [];
  if (ids.length > 1) rows.push(rowFor(null, run.cases));
  ids.forEach((id) => rows.push(rowFor(id, run.cases.filter((c) => prodOf(c) === id))));
  return { sections, rows };
}

// One card per area in this run. A new group added to GROUPS and SECTION_ORDER appears here and wraps with the others.
function metricCards(m) {
  const overall = m.rows.find((r) => !r.id) || m.rows[0];
  const products = m.rows.filter((r) => r.id);
  return m.sections.map((sec) => {
    const all = overall.cells[sec];
    const big = all
      ? `<button class="big ${all.failing ? 'bad' : 'ok'} ${cellOn(sec, overall.id) ? 'active' : ''}" data-sec="${esc(sec)}" data-product="${esc(overall.id || '')}" title="${esc(SECTION_DESC[sec])}">${all.avg.toFixed(2)}</button>`
      : '<div class="bigv">–</div>';
    const status = !all ? '–' : all.failing ? `${all.failing} of ${all.total} failed` : 'all passed';
    const ranked = products.length > 1
      ? products.map((r) => ({ r, st: r.cells[sec] })).filter((x) => x.st).sort((a, b) => a.st.avg - b.st.avg)
      : [];
    const rows = ranked.map(({ r, st }) => `<div class="prow"><button class="pick ${nameOn(r.id) ? 'active' : ''}" data-pick="${esc(r.id)}">${pdot(r.id)}${esc(r.name)}</button><button class="num ${st.failing ? 'bad' : 'quiet'} ${cellOn(sec, r.id) ? 'active' : ''}" data-sec="${esc(sec)}" data-product="${esc(r.id)}" title="${esc(st.failing ? `${st.failing} of ${st.total} cases failed` : 'all cases passed')}">${st.avg.toFixed(2)}</button></div>`).join('');
    return `<div class="areacard"><div class="t" title="${esc(SECTION_DESC[sec])}">${esc(sec)}</div>${big}<div class="ast ${all && all.failing ? 'bad' : 'ok'}">${esc(status)}</div>${rows ? `<div class="plist">${rows}</div>` : ''}</div>`;
  }).join('');
}

function modelCard(run) {
  const line = (label, value) => `<div class="prow"><span>${label}</span><b>${value}</b></div>`;
  if (!judgeEnabled(run)) {
    const why = run.llm_judge && run.llm_judge.status ? run.llm_judge.status : 'This run has no LLM judge.';
    return `<div class="metacard" title="${esc(why)}"><div class="t">Model</div><div class="plist flat">${line('Agent', '–')}${line('Judge', '–')}</div><div class="ast">No LLM judge</div></div>`;
  }
  const j = run.llm_judge;
  const agentP = j.agent_provider || 'cursor';
  const judgeP = j.judge_provider || 'cursor';
  const who = (provider, model) => esc(provider) + ' / ' + esc(model);
  const tip = `agent: ${agentP}/${j.agent_model} · judge: ${judgeP}/${j.judge_model}`;
  return `<div class="metacard" title="${esc(tip)}"><div class="t">Model</div><div class="plist flat">${line('Agent', who(agentP, j.agent_model))}${line('Judge', who(judgeP, j.judge_model))}</div></div>`;
}

function costCard(c) {
  if (!c) return '';
  const tip = [
    `${(c.input_tokens || 0).toLocaleString()} input · ${(c.output_tokens || 0).toLocaleString()} output`,
    `${(c.cache_read_tokens || 0).toLocaleString()} cache read · ${(c.cache_write_tokens || 0).toLocaleString()} cache write`,
    c.complete === false ? 'some calls could not be priced: this is a lower bound' : '',
  ].filter(Boolean).join('\n');
  return `<div class="metacard" title="${esc(tip)}"><div class="t">Cost</div><div class="bigv">${esc(costText(c))}</div><div class="ast">${esc(ktok(c.total_tokens))} tokens · ${c.calls} calls</div><div class="plist"><div class="prow"><span>Agent</span><b>${esc(usd(c.agent_usd))}</b></div><div class="prow"><span>Judge</span><b>${esc(usd(c.judge_usd))}</b></div></div></div>`;
}

function runCards(run) {
  const s = run.summary;
  const tone = s.pass_rate >= 1 ? 'ok' : 'bad';
  const passed = `<div class="metacard"><div class="t">Passed</div><div class="bigv ${tone}">${s.cases_passed}/${s.cases_total}</div><div class="ast ${tone}">${pct(s.pass_rate)} of cases</div></div>`;
  return passed + modelCard(run) + costCard(s.cost);
}

function boardOpen(id) {
  try {
    const saved = JSON.parse(localStorage.getItem('boardOpen') || '{}');
    if (id in saved) return !!saved[id];
  } catch { /* storage unavailable */ }
  return true;
}
function renderScorecard(run) {
  const m = scoreModel(run);
  const sec = (id, label, body) => `<details class="board-sec" data-board="${id}" ${boardOpen(id) ? 'open' : ''}><summary class="board-label">${label}</summary>${body}</details>`;
  $('scorecard').innerHTML = `<div class="board">${sec('run', 'This run', `<div class="metagrid">${runCards(run)}</div>`)}${sec('metrics', 'Metrics', `<div class="areagrid">${metricCards(m)}</div>`)}</div>`;
  document.querySelectorAll('#scorecard .board-sec').forEach((el) => el.addEventListener('toggle', () => {
    try {
      const saved = JSON.parse(localStorage.getItem('boardOpen') || '{}');
      saved[el.dataset.board] = el.open;
      localStorage.setItem('boardOpen', JSON.stringify(saved));
    } catch { /* storage unavailable */ }
  }));
}

// ---------------------------------------------------------------- run tab: case list (master)
function changeOf(c, prev) {
  const before = prev && prev.cases.find((x) => caseKey(x) === caseKey(c));
  if (!before) return '';
  return before.passed && !c.passed ? 'regressed' : !before.passed && c.passed ? 'fixed' : '';
}

function visibleCases(run, prev) {
  const q = state.q.trim().toLowerCase();
  return run.cases.filter((c) => {
    const change = changeOf(c, prev);
    if (state.status === 'failed' && c.passed) return false;
    if (state.status === 'changed' && !change) return false;
    if (state.product && prodOf(c) !== state.product) return false;
    if (state.section && !failedIn(c, state.section).length) return false;
    if (q && !(c.id + ' ' + prodOf(c) + ' ' + c.input).toLowerCase().includes(q)) return false;
    return true;
  });
}

// Products whose case list is folded away (remembered across reloads).
const collapsedProducts = new Set((() => { try { return JSON.parse(localStorage.getItem('collapsedProducts') || '[]'); } catch { return []; } })());
const saveCollapsed = () => { try { localStorage.setItem('collapsedProducts', JSON.stringify([...collapsedProducts])); } catch { /* storage unavailable */ } };
// while searching, show every match even inside folded products
const isCollapsed = (id) => collapsedProducts.has(id) && !state.q.trim();

function orderedCases(run, prev) {
  // grouped by product, failures first inside each group
  const sets = [];
  visibleCases(run, prev).forEach((c) => {
    let g = sets.find((x) => x.id === prodOf(c));
    if (!g) sets.push((g = { id: prodOf(c), name: pinfo(prodOf(c)).name, cases: [] }));
    g.cases.push(c);
  });
  sets.forEach((g) => g.cases.sort((a, b) => Number(a.passed) - Number(b.passed)));
  return sets;
}

function failedSections(c) {
  return sectionNames(Object.keys(c.metrics)).filter((sec) => failedIn(c, sec).length);
}

function caseCostTitle(cost) {
  const part = (name, r) => (r && r.known ? `${name} ${usd(r.cost_usd)} · ${(r.total_tokens || 0).toLocaleString()} tokens` : `${name} –`);
  return [part('agent', cost.agent), part('judge', cost.judge)].join('\n');
}

// Cost tab: model, tokens, and how the price was obtained, for the agent and the judge.
function roleCostCard(name, r, opt = {}) {
  if (!r || !r.known) return `<div><div class="who">${esc(name)}</div><span class="muted">No usage recorded.</span></div>`;
  const SRC = { reported: 'billed by the provider', estimated: 'tokens × list price' };
  const model = opt.model != null ? opt.model : `${r.provider} / ${r.model}`;
  const source = opt.source != null ? opt.source : (r.cost_source ? SRC[r.cost_source] : 'model not in PRICING, cost unknown');
  const num = (n) => (n || 0).toLocaleString();
  const row = (k, v) => `<div class="prow"><span>${esc(k)}</span><b>${esc(String(v))}</b></div>`;
  const rows = [
    row('Input', num(r.input_tokens)),
    row('Output', num(r.output_tokens)),
    row('Cache read', num(r.cache_read_tokens)),
    row('Cache write', num(r.cache_write_tokens)),
  ];
  if (r.reasoning_tokens) rows.push(row('Reasoning', num(r.reasoning_tokens)));
  if (r.ai_credits !== null && r.ai_credits !== undefined) rows.push(row('AI credits', r.ai_credits.toFixed(3)));
  rows.push(row('Calls', r.calls), row('Price', source));
  const calls = `${r.calls} call${r.calls === 1 ? '' : 's'}`;
  return `<div><div class="who">${esc(name)}</div><div class="model">${esc(model)}</div>
    <div class="bigv">${esc(usd(r.cost_usd))}</div>
    <div class="ast">${esc(ktok(r.total_tokens))} tokens · ${esc(calls)}${opt.suffix || ''}</div>
    <div class="plist">${rows.join('')}</div></div>`;
}

function caseCostHtml(c) {
  const cost = c.cost;
  if (!cost || !cost.total) return '<div class="muted">No model or cost data for this case.</div>';
  const { agent, judge, total } = cost;
  const named = (r) => (r && r.known ? `${r.provider} / ${r.model}` : '');
  const agentModel = named(agent);
  const judgeModel = named(judge);
  const totalModel = agentModel && agentModel === judgeModel ? agentModel : [agentModel, judgeModel].filter(Boolean).join(' · ');
  const sources = [agent, judge].filter((r) => r && r.known).map((r) => r.cost_source);
  const totalSource = total.complete === false ? 'lower bound'
    : sources.length && sources.every((s) => s === 'reported') ? 'billed by the provider'
    : sources.length && sources.every((s) => s === 'estimated') ? 'tokens × list price'
    : sources.some(Boolean) ? 'mixed' : 'model not in PRICING, cost unknown';
  const secs = c.agent && c.agent.duration_ms ? ` · ${(c.agent.duration_ms / 1000).toFixed(1)} s` : '';
  const note = total.complete === false
    ? '<div class="hint">Some calls could not be priced (model missing from PRICING). This total is a lower bound.</div>' : '';
  return `<div class="costpane"><div class="cmp">${roleCostCard('Total', total, { model: totalModel, source: totalSource })}${roleCostCard('Agent', agent, { suffix: secs })}${roleCostCard('Judge', judge)}</div>${note}</div>`;
}

function renderCaseList() {
  const { run, prev } = current;
  const sets = orderedCases(run, prev);
  const statuses = [['all', 'All'], ['failed', 'Failed']].concat(prev ? [['changed', 'Changed']] : []);
  if (!statuses.some(([v]) => v === state.status)) state.status = 'all';
  $('case-status').innerHTML = statuses.map(([v, l]) =>
    `<button data-status="${v}" class="${state.status === v ? 'active' : ''}">${l}</button>`).join('');
  document.querySelectorAll('#case-status button').forEach((b) => b.addEventListener('click', () => go({ status: b.dataset.status })));
  $('case-q').hidden = run.cases.length <= 8;       // search only earns its space with many cases
  $('case-q').value = state.q;

  const parts = [state.product ? `<b>${esc(pinfo(state.product).name)}</b>` : '', state.section ? `failing <b>${esc(state.section)}</b>` : ''].filter(Boolean);
  const banner = parts.length
    ? `<div class="activefilter"><span>Showing ${parts.join(' · ')}</span><a id="clear-section">clear</a></div>` : '';
  if (!sets.length) {
    $('caselist').innerHTML = banner + '<div class="none muted">No cases match these filters.</div>';
  } else {
    const multi = sets.length > 1 || !!(run.summary.products && Object.keys(run.summary.products).length);
    $('caselist').innerHTML = banner + sets.map((g) => {
      const failed = g.cases.filter((c) => !c.passed).length;
      const folded = multi && isCollapsed(g.id);
      const pcost = (run.summary.products && run.summary.products[g.id] || {}).cost;
      return (multi ? `<div class="grp ${folded ? 'collapsed' : ''}" style="--pc:${esc(pinfo(g.id).color)}" data-product="${esc(g.id)}" role="button" tabindex="0" aria-expanded="${!folded}" title="${folded ? 'Expand' : 'Collapse'}"><span class="name"><span class="chev">▾</span><span>${esc(g.name)}</span></span><span class="meta">${pcost ? `<span class="pcost" title="${esc(costTitle(pcost))}">${esc(costText(pcost))}</span>` : ''}${failed ? `<span class="nfail">${failed} failed</span>` : ''}<span class="count">${g.cases.length}</span></span></div>` : '') +
        (folded ? '' : g.cases.map((c) => {
          const change = changeOf(c, prev);
          const tags = failedSections(c);
          return `<div class="item ${caseKey(c) === state.caseKey ? 'sel' : ''}" data-key="${esc(caseKey(c))}">
            <span class="dot ${c.passed ? 'pass' : 'fail'}"></span>
            <div><div class="title"><span class="cid" title="${esc(c.id)}">${esc(c.id)}</span>${change ? `<span class="pill ${change}">${change}</span>` : ''}${tags.length ? `<span class="tags">${tags.map((x) => `<span class="tag">${esc(x)}</span>`).join('')}</span>` : ''}${c.cost && c.cost.total ? `<span class="cost" title="${esc(caseCostTitle(c.cost))}">${esc(costText(c.cost.total, 'cost_usd'))}</span>` : ''}</div>
            <div class="sub" title="${esc(c.input)}">“${esc(c.input)}”</div></div></div>`;
        }).join(''));
    }).join('');
  }
  document.querySelectorAll('#caselist .grp').forEach((el) => {
    const toggle = () => {
      const id = el.dataset.product;
      if (collapsedProducts.has(id)) collapsedProducts.delete(id); else collapsedProducts.add(id);
      saveCollapsed();
      renderCaseList();
    };
    el.addEventListener('click', toggle);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  });
  document.querySelectorAll('#caselist .item').forEach((el) => el.addEventListener('click', () => go({ caseKey: el.dataset.key })));
  const clr = $('clear-section');
  if (clr) clr.addEventListener('click', () => go({ section: null, product: null }));
}

// ---------------------------------------------------------------- run tab: case panel (detail)
const fmtVal = (v) => (typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v));
function argChips(args) {
  const entries = Object.entries(args || {});
  if (!entries.length) return '<span class="muted">no arguments</span>';
  return '<div class="args">' + entries.map(([k, v]) => `<span class="arg"><b>${esc(k)}=</b>${esc(fmtVal(v))}</span>`).join('') + '</div>';
}

function idChips(returned, expected, forbidden) {
  const hit = (id, pats) => pats.some((pt) => matchesRef(id, pt));
  const chips = returned.map((id, i) => {
    const cls = hit(id, forbidden) ? 'bad' : hit(id, expected) ? 'ok' : '';
    const tip = cls === 'bad' ? 'forbidden result' : cls === 'ok' ? 'expected result' : 'extra result';
    return `<span class="chip ${cls}" title="${tip}">${i + 1}. ${esc(id)}</span>`;
  });
  expected.filter((pt) => !returned.some((id) => matchesRef(id, pt)))
    .forEach((pt) => chips.push(`<span class="chip bad" title="expected but not returned">missing ${esc(pt)}</span>`));
  if (!chips.length) chips.push('<span class="muted">no results</span>');
  return chips.join('');
}

function rowHtml([name, m]) {
  const help = METRIC_HELP[name];
  return `<div class="row ${m.success ? 'ok' : 'bad'}">
    <span class="ico ${m.success ? 'ok' : 'bad'}">${m.success ? '✓' : '✗'}</span>
    <div class="lbl" title="${esc(name)}">${esc(labelOf(name))}${!m.success && help ? `<div class="help">${esc(help)}</div>` : ''}</div>
    <div class="score"><span class="bar ${m.success ? 'ok' : 'bad'}"><i style="width:${Math.round(m.score * 100)}%"></i></span>${m.score.toFixed(2)}
      <span class="muted" title="pass threshold">/ ${esc(m.threshold)}</span></div>
    <div class="reason">${esc(m.reason)}</div></div>`;
}

function checksHtml(c) {
  const names = Object.keys(c.metrics);
  return sectionNames(names).map((sec) => {
    const rows = names.filter((n) => sectionOf(n) === sec).map((n) => [n, c.metrics[n]])
      .sort((a, b) => Number(a[1].success) - Number(b[1].success));      // failures first
    const bad = rows.filter(([, m]) => !m.success).length;
    return `<details class="chk" ${bad ? 'open' : ''}><summary>
      <span class="sname">${esc(sec)}</span>
      <span class="pill ${bad ? 'fail' : 'pass'}">${rows.length - bad}/${rows.length} passed</span>
      <span class="sdesc">${esc(SECTION_DESC[sec])}</span></summary>
      <div class="rows">${rows.map(rowHtml).join('')}</div></details>`;
  }).join('');
}

function searchHtml(c) {
  const agent = c.agent;
  const calls = agent && agent.tool_calls ? agent.tool_calls : [];
  const secs = agent && agent.duration_ms ? ` · ${(agent.duration_ms / 1000).toFixed(1)} s` : '';
  const legend = (c.expected_ids.length ? `Expected: ${c.expected_ids.map((i) => `<code>${esc(i)}</code>`).join(' ')}` : 'Expected: no results') +
    (c.forbidden_ids.length ? ` · Must not appear: ${c.forbidden_ids.map((i) => `<code>${esc(i)}</code>`).join(' ')}` : '');
  return `<div class="cmp">
      <div><div class="who">Golden · fixed call · ${c.latency_ms.toFixed(1)} ms</div>
        ${argChips(c.arguments)}
        <div class="sub2">Returned</div>${idChips(c.returned_ids, c.expected_ids, c.forbidden_ids)}</div>
      <div><div class="who">Agent · what it chose${secs}</div>
        ${calls.length ? calls.map((t) => `<div style="margin-bottom:6px"><code>${esc(t.name)}</code>${argChips(t.arguments)}</div>`).join('') : '<span class="muted">no tool call</span>'}
        <div class="sub2">Returned</div>${agent ? idChips(agent.returned_ids || [], c.expected_ids, c.forbidden_ids) : '<span class="muted">–</span>'}</div>
    </div>
    <div class="hint">${legend}. Green = expected, red = forbidden or missing.</div>`;
}

function productTable(output) {
  const rows = (output && Array.isArray(output.results)) ? output.results : null;
  if (!rows) return '';
  if (!rows.length) return '<div class="muted">0 results</div>';
  const head = `<div class="muted">${rows.length} of ${esc(output.total_matches ?? '?')} matches</div>`;
  if (rows[0].doc !== undefined) {           // documentation search results
    return head + '<table><thead><tr><th>doc › section</th><th>text</th><th>score</th></tr></thead><tbody>' +
      rows.map((r) => `<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.text)}</td><td>${esc(r.score)}</td></tr>`).join('') + '</tbody></table>';
  }
  return head + `<table><thead><tr><th>id</th><th>name</th><th>category</th><th>price</th><th>score</th></tr></thead><tbody>` +   // older (catalog) runs
    rows.map((r) => `<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.name)}</td><td>${esc(r.category)}</td>
      <td>${esc(r.price)}</td><td>${esc(r.score)}</td></tr>`).join('') + '</tbody></table>';
}

function referenceHtml(c) {
  if (!c.reference_answer && !(c.must_include && c.must_include.length)) return '';
  return `<div class="refbox"><div class="who">Reference (from the golden)</div>
    ${c.reference_answer ? `<div class="txt">${esc(c.reference_answer)}</div>` : ''}
    ${c.must_include && c.must_include.length ? `<div style="margin-top:6px"><span class="muted">Must include</span> ${c.must_include.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}</div>` : ''}</div>`;
}

function flowHtml(c) {
  const flow = c.agent && c.agent.flow;
  if (!flow || !flow.length) return '<div class="muted">No agent run for this case (LLM judge was off, or the run predates it).</div>' + referenceHtml(c);
  return '<div class="flow">' + flow.map((st) => {
    if (st.type === 'user') return `<div class="step user"><div class="who">Customer</div><div class="txt">${esc(st.text)}</div></div>`;
    if (st.type === 'assistant') return `<div class="step assistant"><div class="who">Assistant</div><div class="txt">${esc(st.text)}</div></div>`;
    if (st.type === 'error') return `<div class="step error"><div class="who">Error</div><div class="txt">${esc(st.text)}</div></div>`;
    const out = st.output === null || st.output === undefined ? '<div class="muted">no response captured</div>'
      : (productTable(st.output) || '') + `<details><summary>raw response</summary><pre>${esc(JSON.stringify(st.output, null, 2))}</pre></details>`;
    return `<div class="step tool"><div class="who">Tool call · ${esc(st.server ? st.server + ' / ' : '')}${esc(st.name)} · ${esc(st.status)}</div>
      ${argChips(st.arguments)}
      <div class="who" style="margin-top:10px">MCP response</div>${out}</div>`;
  }).join('') + '</div>' + referenceHtml(c);
}

function renderCasePanel() {
  const { run, prev } = current;
  const c = run.cases.find((x) => caseKey(x) === state.caseKey);
  if (!c) {
    $('casepanel').innerHTML = '<div class="none muted">Select a case on the left.</div>';
    return;
  }
  const change = changeOf(c, prev);
  const all = Object.values(c.metrics);
  const bad = all.filter((m) => !m.success).length;
  const hasFlow = !!(c.agent && c.agent.flow && c.agent.flow.length);
  const hasCost = !!(c.cost && c.cost.total);
  if ((state.view === 'conversation' && !hasFlow) || (state.view === 'cost' && !hasCost)) state.view = 'checks';
  const meta = [c.id, c.product_name || pinfo(prodOf(c)).name,
    bad ? `${bad} of ${all.length} checks failed` : `${all.length} checks passed`];
  if (change) meta.push(change);
  const tabs = [['checks', 'Checks'], ['conversation', 'Conversation'], ['search', 'Search comparison'], ['cost', 'Cost']];
  const body = state.view === 'conversation' ? flowHtml(c) : state.view === 'search' ? searchHtml(c) : state.view === 'cost' ? caseCostHtml(c) : checksHtml(c);
  const tabOff = (v) => (v === 'conversation' && !hasFlow ? 'disabled title="No agent run for this case"'
    : v === 'cost' && !hasCost ? 'disabled title="No model or cost data for this case"' : '');
  $('casepanel').innerHTML = `
    <div class="casehead">
      <h3>“${esc(c.input)}”</h3>
      <div class="case-meta">${meta.map((x) => `<span>${esc(x)}</span>`).join('')}</div>
    </div>
    ${c.error ? `<div class="banner warn" style="margin-top:12px"><b>Tool call failed:</b> <code>${esc(c.error)}</code></div>` : ''}
    <div class="tabs">${tabs.map(([v, l]) =>
      `<button data-view="${v}" class="${state.view === v ? 'active' : ''}" ${tabOff(v)}>${l}</button>`).join('')}</div>
    <div>${body}</div>`;
  document.querySelectorAll('#casepanel .tabs button').forEach((b) => b.addEventListener('click', () => go({ view: b.dataset.view })));
}

// ---------------------------------------------------------------- run tab: orchestration
async function renderRun() {
  if (!state.runId || !runById(state.runId)) state.runId = allRuns[allRuns.length - 1].id;
  const idx = allRuns.findIndex((r) => r.id === state.runId);
  const [run, prev] = await Promise.all([fullRun(state.runId), idx > 0 ? fullRun(allRuns[idx - 1].id) : null]);
  current = { run, prev };
  renderRunBar(run);
  renderBanners(run);
  renderScorecard(run);
  // keep a valid selection: default to the first failing case, else the first one
  const flat = orderedCases(run, prev).flatMap((g) => g.cases);
  if (!flat.some((c) => caseKey(c) === state.caseKey)) {
    const first = flat.find((c) => !c.passed) || flat[0];
    state.caseKey = first ? caseKey(first) : null;
    writeHash(false);
  }
  renderCaseList();
  renderCasePanel();
}

function moveSelection(delta) {
  const { run, prev } = current;
  if (!run) return;
  const flat = orderedCases(run, prev).filter((g) => !isCollapsed(g.id)).flatMap((g) => g.cases);
  if (!flat.length) return;
  const i = flat.findIndex((c) => caseKey(c) === state.caseKey);
  const next = flat[Math.min(Math.max(i + delta, 0), flat.length - 1)];
  go({ caseKey: caseKey(next) }).then(() => {
    const el = document.querySelector('#caselist .item.sel');
    if (el) el.scrollIntoView({ block: 'nearest' });
  });
}

// ---------------------------------------------------------------- boot
async function renderAll() {
  const has = allRuns.length > 0;
  $('empty').hidden = has;
  $('view-overview').hidden = !has || state.tab !== 'overview';
  $('view-run').hidden = !has || state.tab !== 'run';
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === state.tab));
  $('section-title').textContent = state.tab === 'run' ? 'Run details' : 'Overview';
  if (!has) { $('subtitle').textContent = 'no runs yet'; return; }
  const cur = allRuns[allRuns.length - 1];
  const sub = `${allRuns.length} run${allRuns.length === 1 ? '' : 's'} · latest ${fmtTime(cur.timestamp)}`;
  $('subtitle').textContent = sub;
  $('subtitle').title = sub;
  if (state.tab === 'overview') {
    renderKpis(); renderHistory();
    await renderProducts();
  } else {
    await renderRun();
  }
}

async function load() {
  try {
    allRuns = await api('/api/runs');
  } catch (e) {
    $('subtitle').textContent = 'failed to load runs: ' + e.message;
    return;
  }
  buildProducts();
  readHash();
  await renderAll();
}

// ---- destructive actions: one confirmation dialog, used for "clear all" (type "delete") and "delete one run"
const clearDialog = $('clear-dialog');
let pendingAction = null;
function confirmDialog({ title, html, button, typed, action }) {
  pendingAction = action;
  $('clear-title').textContent = title;
  $('clear-text').innerHTML = html;
  $('clear-confirm').textContent = button;
  $('clear-typed').hidden = !typed;
  $('clear-input').value = '';

}
async function deleteRequest(url, init) {

}
$('clear-open').addEventListener('click', () => confirmDialog({

  clearTimeout(qTimer);
  const v = e.target.value;
  qTimer = setTimeout(() => { state.q = v; writeHash(false); renderRun().then(() => { $('case-q').focus(); }); }, 200);
});
window.addEventListener('popstate', async () => { readHash(); await renderAll(); });
window.addEventListener('keydown', (e) => {
  if (state.tab !== 'run' || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); moveSelection(1); }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); moveSelection(-1); }
  const view = { 1: 'checks', 2: 'conversation', 3: 'search', 4: 'cost' }[e.key];
  if (view) go({ view });
});
load();
</script>
</body>
