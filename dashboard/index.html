<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP Evaluator</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171c25; --panel2: #1e2430; --border: #2a3242;
    --text: #e6e9ef; --muted: #8b95a7;
    --good: #5fd39a; --bad: #f2677f; --warn: #f3c066; --accent: #6ea8fe;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  select, input, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
                          border-radius: 6px; padding: 6px 10px; font: inherit; }
  button, select { cursor: pointer; }
  button:hover, select:hover, input:focus { border-color: var(--accent); outline: none; }
  button:disabled { opacity: .35; cursor: default; border-color: var(--border); }

  /* sidebar holds the app name and the two views. The page title shares the top row. */
  .rail { position: fixed; top: 0; left: 0; bottom: 0; width: 220px; z-index: 12;
          display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--border);
          transition: width .16s ease; }
  .rail-head { display: flex; align-items: center; gap: 4px; height: 64px; padding: 0 8px 0 16px;
               border-bottom: 1px solid var(--border); }
  .brand { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 2px;
           flex: 1; min-width: 0; height: auto; padding: 0; text-align: left;
           background: transparent; border: 0; border-radius: 6px; }
  .brand:hover { background: transparent; border-color: transparent; color: var(--text); }
  .brand .name { font-size: 15px; font-weight: 650; line-height: 1.2; }
  .brand .sub { color: var(--muted); font-size: 12px; line-height: 1.25; max-width: 100%;
                display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rail-toggle { flex: none; width: 28px; height: 28px; padding: 0; display: grid; place-items: center;
                 background: transparent; border: 0; border-radius: 6px; color: var(--muted); }
  .rail-toggle:hover { color: var(--text); background: rgba(255,255,255,.06); border-color: transparent; }
  .rail-toggle svg { display: block; transition: transform .16s ease; }
  nav { display: flex; flex-direction: column; gap: 4px; padding: 12px 10px; }
  nav button { display: flex; align-items: center; gap: 10px; text-align: left; background: transparent; border: 0;
               border-radius: 8px; padding: 8px 10px; color: var(--muted); font-weight: 600; }
  nav button svg { flex: none; display: block; }
  nav button:hover { color: var(--text); border-color: transparent; background: rgba(255,255,255,.04); }
  nav button.active, nav button.active:hover { background: #2c3342; color: var(--text); border-color: transparent; }
  body.rail-collapsed .rail { width: 56px; }
  body.rail-collapsed .rail-head { padding: 0; justify-content: center; }
  body.rail-collapsed .brand { display: none; }
  body.rail-collapsed .rail-toggle svg { transform: rotate(180deg); }
  body.rail-collapsed nav { padding: 12px 8px; }
  body.rail-collapsed nav button { justify-content: center; padding: 8px; }
  body.rail-collapsed nav button span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .shell { margin-left: 220px; min-width: 0; transition: margin-left .16s ease; }
  body.rail-collapsed .shell { margin-left: 56px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
           height: 64px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--panel);
           position: sticky; top: 0; z-index: 10; }
  header h1 { margin: 0; font-size: 18px; font-weight: 650; }
  .controls { display: flex; gap: 8px; align-items: center; }
  main { padding: 20px 24px 40px; max-width: 1500px; margin: 0 auto; display: grid; gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }

  /* ---- overview */
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--bad); border-radius: 10px; padding: 20px; max-width: 440px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 8px; }
  dialog input { width: 100%; box-sizing: border-box; margin: 8px 0 4px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  dialog button.confirm { background: var(--bad); border-color: var(--bad); color: #1a0b10; font-weight: 650; }
  .section-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .section-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
  .section-head h3 .muted { font-size: 12px; font-weight: 400; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .kpi .label { color: var(--muted); font-size: 12px; }
  .kpi .value { font-size: 26px; font-weight: 700; margin: 2px 0; }
  .kpi .delta { font-size: 12px; color: var(--muted); }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }
  .hist-filters { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end; }
  .pop-anchor { position: relative; }
  .filter-pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; width: 280px; padding: 12px;
                background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
                box-shadow: 0 16px 40px rgba(0,0,0,.45); }
  .filter-pop input { width: 100%; margin: 0 0 8px; padding: 6px 8px; font-size: 12px; }
  .flist { display: grid; gap: 2px; max-height: 240px; overflow: auto; }
  .filter-pop button.frow-h { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px;
    background: transparent; border: 0; border-radius: 6px; padding: 6px 8px; text-align: left; font-weight: 550; }
  .filter-pop button.frow-h:hover { background: rgba(255,255,255,.05); border-color: transparent; color: var(--text); }
  .fempty { padding: 4px 8px 8px; font-size: 12px; }
  .fsel { display: inline-flex; align-items: center; gap: 6px; }
  .fsel > span { color: var(--muted); font-size: 12px; font-weight: 600; }
  .fsel select { font-size: 12px; padding: 2px 8px; max-width: 160px; }
  .fsel .xbtn { background: transparent; border: 0; color: var(--muted); padding: 0 4px; }
  .fsel .xbtn:hover { color: var(--text); border-color: transparent; }
  td.hist-empty { text-align: center; color: var(--muted); padding: 18px 10px; }
  .seg { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .seg button { padding: 2px 10px; font-size: 12px; border-radius: 999px; color: var(--muted); }
  .seg button.active { border-color: var(--accent); color: var(--text); background: #1b2a44; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
  tbody tr.run-row { cursor: pointer; }
  tbody tr.run-row:hover { background: var(--panel2); }
  td.rowact { width: 1%; text-align: right; }
  button.rowdel { padding: 0 6px; font-size: 13px; line-height: 1.6; opacity: .35; background: transparent; border-color: transparent; }
  tr.run-row:hover button.rowdel, button.rowdel:focus-visible { opacity: 1; }
  button.rowdel:hover { border-color: var(--bad); }
  .scroll { overflow-x: auto; }

  /* ---- shared bits */
  .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill.pass { background: rgba(95,211,154,.15); color: var(--good); }
  .pill.fail { background: rgba(242,103,127,.15); color: var(--bad); }
  .pill.fixed { background: rgba(110,168,254,.18); color: var(--accent); }
  .pill.regressed { background: rgba(243,192,102,.18); color: var(--warn); }
  .pill.info { background: var(--panel2); color: var(--muted); border: 1px solid var(--border); }
  .chip { display: inline-block; border-radius: 4px; padding: 0 6px; margin: 1px 3px 1px 0; font-size: 12px;
          font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--panel2); border: 1px solid var(--border); }
  .chip.ok { border-color: var(--good); color: var(--good); }
  .chip.bad { border-color: var(--bad); color: var(--bad); }
  .chip .k { color: var(--muted); font-weight: 500; margin-right: 5px; }
  .params { display: flex; flex-wrap: nowrap; gap: 4px; align-items: center; }
  .params .chip { margin: 0; white-space: nowrap; }
  #history td { white-space: nowrap; }
  #run-params { margin-top: 10px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .banner { border-radius: 8px; padding: 10px 14px; border: 1px solid var(--border); background: var(--panel2); font-size: 13px; }
  .banner.warn { border-color: var(--warn); background: rgba(243,192,102,.08); }
  .banner.info { border-color: var(--accent); background: rgba(110,168,254,.08); }
  .banner b { font-weight: 650; }

  /* ---- run tab */
  .runbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .runbar select { min-width: 260px; max-width: 100%; }
  .runbar .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

  /* products */
  .pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .phead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .phead input { width: 160px; padding: 3px 10px; font-size: 12px; }

  /* product accordion (overview) */
  #products { display: grid; gap: 10px; }
  .pacc { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .pacc-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 0; user-select: none;
               border-left: 3px solid var(--pc, var(--border)); }
  .pacc-toggle { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 4px 4px 4px 14px; cursor: pointer; }
  .pacc-head .open-product { flex: none; }
  .pacc-toggle:hover { background: #252c3a; border-radius: 8px; }
  .pacc .chev { display: inline-block; width: 12px; color: var(--muted); font-size: 11px; transition: transform .12s; flex: none; }
  .pacc.collapsed .chev { transform: rotate(-90deg); }
  .pacc-name { font-weight: 650; font-size: 14px; white-space: nowrap; }
  .pacc-rate { display: flex; align-items: center; gap: 8px; min-width: 140px; }
  .pacc-rate .bar { width: 70px; }
  .pacc-spacer { flex: 1; }
  .pacc-body { padding: 4px 16px 16px; border-top: 1px solid var(--border); }
  .pacc.collapsed .pacc-body { display: none; }
  .metric-charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding-top: 14px; }
  .progress-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 12px 4px; }
  .progress-card .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 2px; }
  .chart-head b { font-size: 16px; font-variant-numeric: tabular-nums; }
  .chart-head b.ok { color: var(--good); } .chart-head b.warn { color: var(--warn); } .chart-head b.bad { color: var(--bad); }
  .progress { width: 100%; height: 160px; display: block; }
  .progress text { fill: var(--muted); font-size: 11px; font-family: inherit; }
  .progress .pt { cursor: pointer; }
  .progress .pt:hover { stroke: var(--text); stroke-width: 6; }
  .more-products { text-align: center; color: var(--accent); cursor: pointer; padding: 10px; }
  .no-products { text-align: center; color: var(--muted); padding: 16px; }
  .strip { display: inline-flex; gap: 2px; vertical-align: middle; flex-wrap: wrap; max-width: 220px; }
  .strip i { width: 9px; height: 14px; border-radius: 2px; background: var(--border); display: block; }
  .strip i.ok { background: var(--good); } .strip i.bad { background: var(--bad); }
  .refbox { margin-top: 16px; width: 100%; border: 1px dashed var(--border); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .refbox .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }

  .split { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 16px; align-items: start; }
  .listcard { padding: 0; position: sticky; top: 84px; max-height: calc(100vh - 108px); display: flex; flex-direction: column; overflow: hidden; }
  .filters { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .filters .seg { flex: none; flex-wrap: nowrap; gap: 0; align-items: stretch; height: 32px; padding: 2px;
                  background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; }
  .filters .seg button { background: transparent; border: 0; border-radius: 6px; color: var(--muted);
                         font-size: 12px; font-weight: 600; padding: 0 9px; height: 100%; line-height: 1; }
  .filters .seg button:hover { color: var(--text); border-color: transparent; background: transparent; }
  .filters .seg button.active, .filters .seg button.active:hover { background: #2c3342; color: var(--text); border-color: transparent; }
  .filters input { flex: 1; min-width: 0; height: 32px; border-radius: 8px; padding: 0 10px; font-size: 12px; background: var(--panel2); }
  .filters input::placeholder { color: var(--muted); }
  .filters input:focus { border-color: #5c6778; }
  .activefilter { padding: 8px 12px; font-size: 12px; background: #1b2a44; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .activefilter a { color: var(--accent); cursor: pointer; }
  #caselist { overflow-y: auto; flex: 1; }
  .grp { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 9px 12px 9px 14px; background: var(--panel); border-bottom: 1px solid var(--border); border-left: 3px solid transparent;
         font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; }
  .grp:hover { background: #222833; }
  .grp .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .grp .chev { display: inline-block; width: 12px; color: var(--muted); font-size: 11px; transition: transform .12s; }
  .grp.collapsed .chev { transform: rotate(-90deg); }
  .grp .meta { display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: var(--muted); flex: none; }
  .grp .pcost { display: none; }
  .grp .count, .grp .nfail { background: none; border: 0; color: var(--muted); padding: 0; border-radius: 0; min-width: 0; }
  .item { display: flex; gap: 0; padding: 9px 14px 8px 46px; border-bottom: 1px solid rgba(255,255,255,.05); cursor: pointer; border-left: 3px solid transparent; }
  .item:hover { background: rgba(255,255,255,.03); }
  .item.sel, .item.sel:hover { background: #2c3342; border-left-color: transparent; }
  .dot { display: none; }
  .item > div { min-width: 0; flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; }
  .item .title { font-weight: 500; font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; line-height: 1.35; }
  .item .cost { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* case Cost tab: total, agent, and judge as the same card */
  .costpane { display: grid; gap: 12px; }
  .costpane .cmp { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .costpane .cmp .who { margin-bottom: 2px; }
  .costpane .model { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
  .costpane .plist { margin-top: 10px; }
  .costpane .prow { font-size: 13px; padding: 3px 0; color: var(--muted); }
  .costpane .prow b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }

  /* run details: model/cost first, then metric cards. Both sections collapse. auto-fit so extra metrics wrap. */
  .board { display: grid; gap: 16px; margin-top: 14px; }
  .board-sec > summary.board-label { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 8px; width: fit-content;
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .board-sec > summary.board-label::-webkit-details-marker { display: none; }
  .board-sec > summary.board-label::marker { content: ''; }
  .board-sec > summary.board-label::before { content: '▾'; font-size: 11px; transition: transform .12s; }
  .board-sec:not([open]) > summary.board-label::before { transform: rotate(-90deg); }
  .board-sec .areagrid, .board-sec .metagrid { margin-top: 8px; }
  button.pick, button.num, button.big { background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; }
  button.pick { font-weight: 600; text-align: left; border-radius: 6px; padding: 3px 6px; }
  button.pick:hover { background: var(--panel); }
  button.pick.active { background: #1b2a44; }
  button.num { font-variant-numeric: tabular-nums; font-weight: 650; border-radius: 6px; padding: 4px 8px; }
  button.num.ok { color: var(--good); }
  button.num.bad { color: var(--bad); }
  button.num.quiet { color: var(--muted); font-weight: 550; }
  button.num:hover { background: var(--panel); }
  button.num.active { background: #1b2a44; }
  .areagrid, .metagrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .areacard, .metacard { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 8px; }
  .areacard .t, .metacard .t { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  button.big { display: inline-block; padding: 0 4px; margin: 2px 0 0; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; border-radius: 6px; }
  button.big.ok { color: var(--good); }
  button.big.bad { color: var(--bad); }
  button.big:hover, button.big.active { background: #1b2a44; }
  .ast { font-size: 12px; margin: 0 0 8px; }
  .ast.ok { color: var(--good); }
  .ast.bad { color: var(--bad); }
  .plist { border-top: 1px solid var(--border); padding-top: 4px; display: grid; }
  .prow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .prow .pick { font-weight: 550; font-size: 13px; }
  .prow button.num { font-size: 13px; padding: 3px 6px; }
  .bigv { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; }
  .bigv.ok, .metacard .ast.ok { color: var(--good); }
  .bigv.bad, .metacard .ast.bad { color: var(--bad); }
  .metacard .plist { margin-top: 4px; }
  .metacard .plist.flat { border-top: 0; padding-top: 2px; }
  .metacard .prow { font-size: 13px; padding: 2px 0; color: var(--muted); }
  .metacard .prow b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .item .sub { color: var(--text); font-size: 13px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item:has(.dot.pass) .sub { color: #6f7a8c; }
  .item.sel .sub, .item.sel:has(.dot.pass) .sub { color: var(--text); }
  .item .tags, .item .cost { display: none; }
  .tags { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag { font-size: 10.5px; padding: 0 7px; border-radius: 999px; background: rgba(242,103,127,.14); color: var(--bad); font-weight: 500; }
  .none { padding: 28px 16px; text-align: center; }

  .casehead h3 { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.4; }
  .case-meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
  .case-meta span + span::before { content: '·'; margin: 0 8px; color: #5c6778; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 16px 0 16px; }
  .tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; color: var(--muted); font-weight: 600; }
  .tabs button:hover { color: var(--text); border-color: transparent; border-bottom-color: var(--border); }
  .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tabs button:disabled { opacity: .4; cursor: default; }

  /* checks: one collapsible block per area, failing areas open */
  .chk { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--panel2); overflow: hidden; }
  .chk > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 11px 14px; cursor: pointer; color: var(--text); font-size: 14px; }
  .chk > summary::-webkit-details-marker { display: none; }
  .chk > summary::before { content: '▸'; color: var(--muted); font-size: 11px; transition: transform .12s; }
  .chk[open] > summary::before { transform: rotate(90deg); }
  .chk .sname { font-weight: 650; }
  .chk .sdesc { color: var(--muted); font-size: 12px; flex: 1; text-align: right; }
  .rows { border-top: 1px solid var(--border); background: var(--panel); }
  .row { display: grid; grid-template-columns: 18px minmax(150px, 210px) 120px 1fr; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); align-items: start; font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .row .ico { font-weight: 700; }
  .row .ico.ok { color: var(--good); } .row .ico.bad { color: var(--bad); }
  .row .lbl { font-weight: 600; }
  .row .help { font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .row .reason { color: var(--muted); }
  .row.bad .reason { color: var(--text); }
  .score { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 56px; height: 6px; background: var(--panel2); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; }
  .bar.ok i { background: var(--good); } .bar.bad i { background: var(--bad); }

  /* search comparison */
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cmp > div { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .cmp .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 8px; }
  .cmp .sub2 { color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  .args { display: flex; gap: 6px; flex-wrap: wrap; }
  .arg { font: 12px ui-monospace, Menlo, Consolas, monospace; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 1px 8px; }
  .arg b { color: var(--muted); font-weight: 400; }

  /* conversation timeline */
  .flow { position: relative; display: grid; gap: 12px; width: 100%; padding-left: 24px; }
  .flow::before { content: ''; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px; background: var(--border); }
  .step { position: relative; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; background: var(--panel2); font-size: 13px; }
  .step::before { content: ''; position: absolute; left: -24px; top: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); border: 2px solid var(--panel); }
  .step.user::before { background: var(--accent); } .step.tool::before { background: var(--warn); }
  .step.assistant::before { background: var(--good); } .step.error::before { background: var(--bad); }
  .step .who { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .step.tool { background: var(--panel); }
  .step.error { color: var(--bad); border-color: var(--bad); }
  .step .txt { white-space: pre-wrap; }
  .step pre { margin: 6px 0 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; overflow-x: auto;
              font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--muted); max-height: 320px; }
  .step table { margin-top: 6px; font-size: 12px; }
  .step th, .step td { padding: 4px 8px; }
  .empty { text-align: center; padding: 48px 16px; }
  .empty pre { display: inline-block; text-align: left; background: var(--panel2); padding: 12px 16px; border-radius: 8px; }
  kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  @media (max-width: 960px) {
    .split { grid-template-columns: 1fr; }
    .listcard { position: static; max-height: 360px; }
    .cmp, .costpane .cmp { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside class="rail">
  <div class="rail-head">
    <button type="button" class="brand" id="brand" title="Overview">
      <span class="name">MCP Evaluator</span>
      <span class="sub" id="subtitle">loading…</span>
    </button>
    <button type="button" class="rail-toggle" id="rail-toggle" aria-expanded="true" aria-label="Collapse sidebar" title="Collapse sidebar">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <nav>
    <button id="tab-overview" data-tab="overview" title="Overview">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.2" y="1.2" width="5.6" height="5.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9.2" y="1.2" width="5.6" height="5.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.2" y="9.2" width="5.6" height="5.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9.2" y="9.2" width="5.6" height="5.6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Overview</span>
    </button>
    <button id="tab-run" data-tab="run" title="Run details">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Run details</span>
    </button>
  </nav>
</aside>
<div class="shell">
<header>
  <h1 id="section-title">Overview</h1>
  <div class="controls">
    <button id="refresh">Refresh</button>
  </div>
</header>

<dialog id="clear-dialog">
  <h3 id="clear-title"></h3>
  <p id="clear-text"></p>
  <div id="clear-typed">
    <label class="muted" for="clear-input">Type <code>delete</code> to confirm</label>
    <input id="clear-input" autocomplete="off" spellcheck="false" placeholder="delete">
  </div>
  <div id="clear-error" class="muted" style="color:var(--bad)" hidden></div>
  <div class="actions">
    <button id="clear-cancel">Cancel</button>
    <button id="clear-confirm" class="confirm" disabled></button>
  </div>
</dialog>

<main>
  <section id="empty" class="card empty" hidden>
    <h2>No runs yet</h2>
    <p>Run the evaluations and refresh this page:</p>
    <pre>docker compose run --rm evals</pre>
  </section>

  <!-- ============================== OVERVIEW ============================== -->
  <div id="view-overview" hidden style="display:contents">
    <!-- Part 1: the latest run on its own. Runs are not compared: each one may cover different products and cases. -->
    <div class="section-head">
      <h3>Latest run <span class="muted" id="latest-info"></span></h3>
      <button id="latest-open">Open details →</button>
    </div>
    <section class="kpis" id="kpis"></section>

    <div class="section-head" id="products-head" style="margin-top:4px">

      <div class="phead">

      <div id="products"></div>
    </section>

    <!-- Part 2: one row per stored run -->
    <div class="section-head" style="margin-top:12px">
      <h3>History</h3>
      <span style="display:flex;gap:8px;align-items:center"><label class="muted" for="range">Show</label>
        <select id="range">
          <option value="0">all runs</option>
          <option value="10">last 10</option>
          <option value="30">last 30</option>
          <option value="100">last 100</option>

        <button id="clear-open" class="danger" title="Delete all stored runs">Clear history…</button></span>

    <section class="card">
      <div class="card-head">

  <!-- ============================== RUN DETAILS ============================== -->

      <div class="runbar">
